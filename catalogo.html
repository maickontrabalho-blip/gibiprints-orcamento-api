<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIBIPRINTS — Catálogo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#0f6b3b;--yellow:#f2c94c;--ink:#173326;--muted:#66736c;--bg:#f5f7f5;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:rgba(245,247,245,.94);backdrop-filter:blur(12px);border-bottom:1px solid #e3e8e4}
.top{max-width:980px;margin:auto;padding:18px 18px 14px;text-align:center}.brand{font-size:26px;font-weight:900;letter-spacing:.5px;color:var(--green)}.brand span{color:#d7a900}.sub{margin-top:4px;color:var(--muted);font-size:13px}
main{max-width:980px;margin:auto;padding:18px}.status{text-align:center;color:var(--muted);padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border:1px solid #e4e9e5;border-radius:22px;overflow:hidden;box-shadow:0 8px 28px rgba(20,50,35,.07)}
.media{height:340px;background:linear-gradient(135deg,#edf2ee,#dfe8e1);display:flex;align-items:center;justify-content:center;color:#7b8a81;font-size:54px;position:relative}.media small{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#718078}.body{padding:17px}.line{font-size:12px;font-weight:800;letter-spacing:.9px;color:var(--green);text-transform:uppercase}.name{font-size:22px;font-weight:900;margin:5px 0 8px}.desc{font-size:14px;line-height:1.5;color:var(--muted);min-height:42px}.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.price{background:#f1f6f2;border-radius:12px;padding:9px 5px;text-align:center}.price b{display:block;font-size:15px;color:var(--green)}.price span{font-size:10px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:35px 18px 50px}.error{color:#a33;background:#fff0f0;border:1px solid #f1cccc;padding:14px;border-radius:14px}
@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:1fr}.media{height:330px}.prices{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">GIBI<span>PRINTS</span></div><div class="sub">Cada estampa conta uma história</div></div></header>
<main><div id="status" class="status">Carregando catálogo…</div><section id="grid" class="grid"></section></main>
<footer>GIBIPRINTS • Catálogo online</footer>
<script>
const SUPABASE_URL='https://cydmbhmmwkzdthqzvogg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_rzm07nSNcD2CLa6DLtVurQ_XPU8o2B2';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function priceCards(precos){
 const labels=['1 a 9','10 a 19','20 a 49','50+'];
 const vals=Array.isArray(precos)?precos.filter(v=>Number(v)>0).slice(0,4):[];
 return vals.map((v,i)=>`<div class="price"><b>${money(v)}</b><span>${labels[i]}</span></div>`).join('');
}
function card(p){
 const categoria=p.categoria||'Linha';
 return `<article class="card"><div class="media">📷<small>As fotos online serão conectadas nesta próxima etapa.</small></div><div class="body"><div class="line">Linha: ${esc(categoria)}</div><div class="name">${esc(p.nome||'Produto')}</div><div class="desc">${esc(p.descricao||'Confira este produto no catálogo GIBIPRINTS.')}</div><div class="prices">${priceCards(p.precos)}</div></div></article>`;
}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function load(){
 const status=document.getElementById('status');
 try{
  const {data,error}=await supabaseClient.from('produtos').select('nome,categoria,descricao,precos,ativo').eq('ativo',true).order('nome');
  if(error)throw error;
  const items=Array.isArray(data)?data:[];
  document.getElementById('grid').innerHTML=items.map(card).join('');
  status.textContent=items.length?`${items.length} produto(s) no catálogo`:'Nenhum produto ativo no catálogo.';
 }catch(e){console.error(e);status.innerHTML='<div class="error">Não foi possível carregar o catálogo agora.</div>';}
}
load();
</script>
</body>
</html>
