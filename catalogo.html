:root{--green:#0f6b3b;--green2:#0b572f;--yellow:#f2c94c;--ink:#173326;--muted:#66736c;--bg:#f5f7f5;--card:#fff;--line:#e2e9e4;--danger:#b42318}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:50;background:rgba(245,247,245,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:auto;padding:15px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:25px;font-weight:950;letter-spacing:.5px;color:var(--green)}.brand span{color:#c59b00}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.cartBtn{border:0;background:var(--green);color:#fff;border-radius:999px;padding:11px 15px;font-weight:900;box-shadow:0 7px 18px rgba(15,107,59,.18);white-space:nowrap}.cartCount{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:5px;background:var(--yellow);color:#173326;border-radius:99px;font-size:12px}
main{max-width:1100px;margin:auto;padding:18px}.status{text-align:center;color:var(--muted);padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 28px rgba(20,50,35,.07)}
.gallery{height:350px;background:linear-gradient(135deg,#edf2ee,#dfe8e1);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.gallery img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}.gallery.empty{font-size:55px;color:#829088}.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.6;border:1px solid #777}.dot.active{opacity:1;background:var(--yellow);border-color:#8c7400}.nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.38);color:#fff;width:34px;height:34px;border-radius:50%;font-weight:900}.nav.prev{left:10px}.nav.next{right:10px}
.body{padding:17px}.line{font-size:11px;font-weight:900;letter-spacing:.9px;color:var(--green);text-transform:uppercase}.name{font-size:22px;font-weight:950;margin:5px 0 8px}.desc{font-size:14px;line-height:1.5;color:var(--muted);min-height:42px}.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}.price{background:#f1f6f2;border-radius:11px;padding:8px 4px;text-align:center}.price b{display:block;font-size:14px;color:var(--green)}.price span{font-size:9px;color:var(--muted)}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px;color:#506058}.field select,.field input,.field textarea{width:100%;border:1px solid #ccd8d0;border-radius:11px;background:#fff;padding:10px;color:var(--ink);outline:none}.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,107,59,.1)}.qtyRow{display:flex;gap:8px;align-items:end;margin-top:10px}.qty{display:flex;align-items:center;border:1px solid #ccd8d0;border-radius:11px;overflow:hidden;background:#fff}.qty button{border:0;background:#f1f6f2;width:38px;height:42px;font-size:19px;font-weight:900;color:var(--green)}.qty input{border:0!important;border-radius:0!important;text-align:center;width:58px;padding:9px 2px!important;box-shadow:none!important}.add{flex:1;border:0;border-radius:11px;height:42px;background:var(--green);color:#fff;font-weight:950}.add:active,.cartBtn:active{transform:translateY(1px)}
.cartPanel{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.45);padding:12px}.cartPanel.open{display:flex;align-items:flex-end;justify-content:center}.cartBox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 10px 10px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.cartHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.close{border:0;background:#eef3ef;color:var(--ink);width:38px;height:38px;border-radius:50%;font-weight:900}.cartItem{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}.cartItemHead{display:flex;justify-content:space-between;gap:10px}.cartItem b{font-weight:950}.meta{font-size:12px;color:var(--muted);margin-top:4px}.itemActions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.remove{border:0;background:#fff0ef;color:var(--danger);border-radius:9px;padding:7px 10px;font-weight:800}.summary{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.total{font-size:21px;font-weight:950;display:flex;justify-content:space-between}.checkout{width:100%;border:0;background:var(--green);color:#fff;padding:13px;border-radius:13px;font-weight:950;margin-top:12px}.checkout:disabled{background:#b9c5be;color:#fff;cursor:not-allowed;box-shadow:none}.minOrder{font-size:13px;font-weight:800;border-radius:12px;padding:10px;margin-top:10px;text-align:center;background:#fff7df;color:#7a5a00;border:1px solid #ead08a}.minOrder.ok{background:#eef8f0;color:var(--green);border-color:#b9d9c1}.clear{width:100%;border:1px solid #ccd8d0;background:#fff;color:var(--ink);padding:11px;border-radius:13px;font-weight:800;margin-top:8px}.customer{margin-top:12px;display:grid;gap:9px}.customer input,.customer textarea,.customer select{width:100%;border:1px solid #ccd8d0;border-radius:11px;padding:10px;background:#fff;color:var(--ink)}

@media(max-width:560px){.addressGrid{grid-template-columns:1fr}.addressGrid .full{grid-column:auto}}.customer input,.customer textarea{width:100%;border:1px solid #ccd8d0;border-radius:11px;padding:10px}.emptyCart{text-align:center;color:var(--muted);padding:30px 10px}.notice{font-size:12px;color:var(--muted);background:#f4f8f5;border-radius:12px;padding:10px;margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:35px 18px 50px}.error{color:#a33;background:#fff0f0;border:1px solid #f1cccc;padding:14px;border-radius:14px}
@media(max-width:650px){.top{align-items:flex-start}.sub{display:none}.grid{grid-template-columns:1fr}.gallery{height:330px}.prices{grid-template-columns:repeat(2,1fr)}.formGrid{grid-template-columns:1fr}.cartPanel{padding:0}.cartBox{border-radius:24px 24px 0 0;max-height:94vh}}

<header><div class="top"><div><div class="brand">GIBI<span>PRINTS</span></div><div class="sub">Cada estampa conta uma história</div></div><button class="cartBtn" onclick="openCart()">🛒 Carrinho <span id="cartCount" class="cartCount">0</span></button></div></header>
<main><div id="status" class="status">Carregando catálogo…</div><section id="grid" class="grid"></section></main>
<footer>GIBIPRINTS • Catálogo online • Pedido mínimo: 5 itens</footer>
<div id="cartPanel" class="cartPanel" onclick="if(event.target===this)closeCart()"><div class="cartBox"><div class="cartHead"><div><h2 style="margin:0">🛒 Seu pedido</h2><div class="meta">Confira os produtos, cores, tamanhos e quantidades.</div></div><button class="close" onclick="closeCart()">✕</button></div><div id="cartList"></div><div id="cartSummary"></div></div></div>
<script>
const SUPABASE_URL='https://cydmbhmmwkzdthqzvogg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_rzm07nSNcD2CLa6DLtVurQ_XPU8o2B2';
const WHATSAPP_NUMBER='5521982511405';
const supabaseClient=window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY) : null;
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const keyFor=(p,c,s)=>`${String(p.id)}|${String(c)}|${String(s)}`;
let products=[];let cart=[];let galleryState={};
try{cart=JSON.parse(localStorage.getItem('GIBIPRINTS_PUBLIC_CART')||'[]');if(!Array.isArray(cart))cart=[];}catch(_){cart=[];}
function fallbackSizes(p){const nome=String(p.nome||'').toLowerCase();const cat=String(p.categoria||'').toLowerCase();const texto=nome+' '+cat;if(/boné|bone/.test(texto))return ['Único'];if(/avental/.test(texto))return ['Único'];if(/infantil|criança|crianca/.test(texto))return ['02','04','06','08','10','12','14'];return ['P','M','G','GG'];}
function fallbackColors(p){const texto=(String(p.nome||'')+' '+String(p.categoria||'')).toLowerCase();if(/avental/.test(texto))return ['Preto','Branco'];return ['Branco','Preto','Vermelho','Azul Marinho','Azul Royal','Verde','Amarelo','Rosa','Cinza','Laranja','Roxo'];}
function getSizes(p){return Array.isArray(p.tamanhos)&&p.tamanhos.length?p.tamanhos:fallbackSizes(p)}
function getColors(p){return Array.isArray(p.cores)&&p.cores.length?p.cores:fallbackColors(p)}
function unitPrice(p,q){const v=Array.isArray(p.precos)?p.precos.map(Number):[];if(q>=50)return v[3]||v[2]||v[1]||v[0]||0;if(q>=20)return v[2]||v[1]||v[0]||0;if(q>=10)return v[1]||v[0]||0;return v[0]||0}
function priceCards(precos){const labels=['1 a 9','10 a 19','20 a 49','50+'];const vals=Array.isArray(precos)?precos.slice(0,4):[];return vals.map((v,i)=>`<div class="price"><b>${money(v)}</b><span>${labels[i]}</span></div>`).join('')}
function galleryHtml(p){
  const fotos=(p.fotos||[]).filter(Boolean);
  const realIndex=galleryState[p.id]||0;
  if(!fotos.length)return '<div class="gallery empty">📷</div>';
  if(fotos.length===1){
    return `<div class="gallery swipe-gallery" data-id="${esc(p.id)}"><div class="swipe-track"><div class="swipe-slide"><img src="${esc(fotos[0])}" alt="${esc(p.nome)}"></div></div></div>`;
  }
  const slides=[fotos[fotos.length-1],...fotos,fotos[0]];
  const dots=fotos.map((_,i)=>`<span class="dot ${i===realIndex?'active':''}"></span>`).join('');
  return `<div class="gallery swipe-gallery" data-id="${esc(p.id)}" data-count="${fotos.length}">
    <div class="swipe-track">${slides.map((url,i)=>`<div class="swipe-slide"><img src="${esc(url)}" alt="${esc(p.nome)} — foto ${((i-1+fotos.length)%fotos.length)+1}" draggable="false"></div>`).join('')}</div>
    <button class="nav prev" type="button" aria-label="Foto anterior" onclick="event.stopPropagation();changeGallery('${esc(p.id)}',-1)">‹</button>
    <button class="nav next" type="button" aria-label="Próxima foto" onclick="event.stopPropagation();changeGallery('${esc(p.id)}',1)">›</button>
    <div class="dots">${dots}</div>
  </div>`;
}
function productCard(p){const sizes=getSizes(p),colors=getColors(p);return `<article class="card" id="prod-${esc(p.id)}">${galleryHtml(p)}<div class="body"><div class="line">Linha: ${esc(p.categoria||'Produto')}</div><div class="name">${esc(p.nome||'Produto')}</div><div class="desc">${esc(p.descricao||'Confira este produto no catálogo GIBIPRINTS.')}</div><div class="prices">${priceCards(p.precos)}</div><div class="formGrid"><div class="field"><label>Tamanho</label><select id="size-${esc(p.id)}">${sizes.map((x,i)=>`<option value="${esc(x)}" ${i===0?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Cor</label><select id="color-${esc(p.id)}">${colors.map((x,i)=>`<option value="${esc(x)}" ${i===0?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="qtyRow"><div><label style="display:block;font-size:11px;font-weight:900;margin-bottom:5px;color:#506058">Quantidade</label><div class="qty"><button onclick="changeQty('${esc(p.id)}',-1)">−</button><input id="qty-${esc(p.id)}" type="number" min="1" max="999" value="1"><button onclick="changeQty('${esc(p.id)}',1)">+</button></div></div><button class="add" onclick="addToCart('${esc(p.id)}')">🛒 Adicionar ao carrinho</button></div></div></article>`}
function galleryWrap(id){return document.querySelector(`.swipe-gallery[data-id="${CSS.escape(String(id))}"]`)}
function galleryRender(id,animate=true){
  const p=products.find(x=>String(x.id)===String(id)); if(!p||!p.fotos?.length)return;
  const wrap=galleryWrap(id); if(!wrap)return;
  const count=p.fotos.length;
  if(count<2)return;
  const track=wrap.querySelector('.swipe-track'); if(!track)return;
  const physical=(galleryState[id]||0)+1;
  track.style.transition=animate?'transform .28s ease':'none';
  track.style.transform=`translate3d(${-physical*100}%,0,0)`;
  wrap.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===((galleryState[id]||0)+count)%count));
}
function galleryRebuild(id){
  const p=products.find(x=>String(x.id)===String(id)); if(!p)return;
  const el=document.getElementById('prod-'+id); if(!el)return;
  el.outerHTML=productCard(p);
  bindSwipeGallery(p);
}
function changeGallery(id,d){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p||!p.fotos?.length)return;
  const count=p.fotos.length;
  if(count<2)return;

  const wrap=galleryWrap(id);
  const track=wrap?.querySelector('.swipe-track');
  if(!wrap||!track)return;

  const current=((galleryState[id]||0)%count+count)%count;
  let physical=current+1+d;
  let logical;

  if(physical===0)logical=count-1;
  else if(physical===count+1)logical=0;
  else logical=physical-1;

  galleryState[id]=logical;
  track.style.transition='transform .28s cubic-bezier(.22,.61,.36,1)';
  track.style.transform=`translate3d(${-physical*100}%,0,0)`;
  wrap.querySelectorAll('.dot').forEach((dot,i)=>dot.classList.toggle('active',i===logical));
}

function bindSwipeGallery(p){
  const wrap=galleryWrap(p.id);
  if(!wrap||!p.fotos||p.fotos.length<2)return;
  const track=wrap.querySelector('.swipe-track');
  if(!track)return;

  const count=p.fotos.length;
  let logicalIndex=((galleryState[p.id]||0)%count+count)%count;
  let physicalIndex=logicalIndex+1;
  let startX=0,startY=0,dragging=false;

  const setDots=()=>{
    wrap.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===logicalIndex));
  };

  const apply=(animate=true,offset=0)=>{
    track.style.transition=animate?'transform .28s cubic-bezier(.22,.61,.36,1)':'none';
    track.style.transform=`translate3d(calc(${-physicalIndex*100}% + ${offset}px),0,0)`;
    setDots();
  };

  const normalizeAfterLoop=()=>{
    if(physicalIndex===0){
      physicalIndex=count;
      logicalIndex=count-1;
      galleryState[p.id]=logicalIndex;
      apply(false);
    }else if(physicalIndex===count+1){
      physicalIndex=1;
      logicalIndex=0;
      galleryState[p.id]=logicalIndex;
      apply(false);
    }else{
      logicalIndex=physicalIndex-1;
      galleryState[p.id]=logicalIndex;
      setDots();
    }
  };

  track.addEventListener('transitionend',e=>{
    if(e.propertyName!=='transform')return;
    normalizeAfterLoop();
  });

  const start=e=>{
    if(e.touches&&e.touches.length!==1)return;
    const t=e.touches?e.touches[0]:e;
    startX=t.clientX;
    startY=t.clientY;
    dragging=true;
    track.style.transition='none';
  };

  const move=e=>{
    if(!dragging)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-startX;
    const dy=t.clientY-startY;
    if(Math.abs(dx)<4)return;

    if(Math.abs(dy)>Math.abs(dx)){
      dragging=false;
      apply(true);
      return;
    }

    e.preventDefault();
    track.style.transform=`translate3d(calc(${-physicalIndex*100}% + ${dx}px),0,0)`;
  };

  const end=e=>{
    if(!dragging)return;
    const t=e.changedTouches?e.changedTouches[0]:e;
    const dx=t.clientX-startX;
    dragging=false;

    if(Math.abs(dx)>35){
      physicalIndex += dx<0 ? 1 : -1;

      if(physicalIndex<0)physicalIndex=0;
      if(physicalIndex>count+1)physicalIndex=count+1;

      if(physicalIndex===0)logicalIndex=count-1;
      else if(physicalIndex===count+1)logicalIndex=0;
      else logicalIndex=physicalIndex-1;

      galleryState[p.id]=logicalIndex;
      apply(true);
    }else{
      apply(true);
    }
  };

  wrap.addEventListener('touchstart',start,{passive:true});
  wrap.addEventListener('touchmove',move,{passive:false});
  wrap.addEventListener('touchend',end,{passive:true});

  let mouseDown=false;
  wrap.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    mouseDown=true;
    start(e);
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(mouseDown)move(e);
  });
  window.addEventListener('mouseup',e=>{
    if(mouseDown){
      mouseDown=false;
      end(e);
    }
  });

  physicalIndex=logicalIndex+1;
  apply(false);
}

function changeQty(id,d){const el=document.getElementById('qty-'+id);if(!el)return;el.value=Math.max(1,Math.min(999,(Number(el.value)||1)+d))}
function addToCart(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const size=document.getElementById('size-'+id)?.value||getSizes(p)[0];const color=document.getElementById('color-'+id)?.value||getColors(p)[0];const qty=Math.max(1,Math.min(999,Number(document.getElementById('qty-'+id)?.value)||1));const key=keyFor(p,color,size);const old=cart.find(x=>x.key===key);if(old)old.qty+=qty;else cart.push({key,productId:p.id,product:p.nome,color,size,qty,unitPrice:unitPrice(p,qty)});repriceCart();saveCart();renderCart();flashCart();}
function repriceCart(){for(const item of cart){const p=products.find(x=>String(x.id)===String(item.productId));if(p)item.unitPrice=unitPrice(p,item.qty)};}
function saveCart(){localStorage.setItem('GIBIPRINTS_PUBLIC_CART',JSON.stringify(cart));updateCartCount()}
function updateCartCount(){document.getElementById('cartCount').textContent=String(cart.reduce((n,x)=>n+Number(x.qty||0),0))}
function flashCart(){const b=document.querySelector('.cartBtn');if(!b)return;b.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:260})}
function removeCart(key){cart=cart.filter(x=>x.key!==key);saveCart();renderCart()}
function adjustCart(key,d){const x=cart.find(i=>i.key===key);if(!x)return;x.qty=Math.max(1,Math.min(999,Number(x.qty||1)+d));repriceCart();saveCart();renderCart()}
function openCart(){renderCart();document.getElementById('cartPanel').classList.add('open');document.body.style.overflow='hidden'}
function closeCart(){document.getElementById('cartPanel').classList.remove('open');document.body.style.overflow=''}
function renderCart(){updateCartCount();const list=document.getElementById('cartList'),summary=document.getElementById('cartSummary');if(!cart.length){list.innerHTML='<div class="emptyCart">Seu carrinho está vazio.<br>Escolha produtos, tamanho, cor e quantidade para começar.</div>';summary.innerHTML='';return}repriceCart();list.innerHTML=cart.map(x=>`<div class="cartItem"><div class="cartItemHead"><div><b>${esc(x.product)}</b><div class="meta">Cor: ${esc(x.color)} • Tamanho: ${esc(x.size)}</div></div><b>${money(Number(x.unitPrice)*Number(x.qty))}</b></div><div class="itemActions"><div class="qty"><button onclick="adjustCart('${esc(x.key)}',-1)">−</button><input value="${Number(x.qty)}" readonly><button onclick="adjustCart('${esc(x.key)}',1)">+</button></div><button class="remove" onclick="removeCart('${esc(x.key)}')">🗑️ Remover</button></div></div>`).join('');const total=cart.reduce((s,x)=>s+Number(x.unitPrice||0)*Number(x.qty||0),0);const totalItems=cart.reduce((s,x)=>s+Number(x.qty||0),0);const faltam=Math.max(0,5-totalItems);const podeFinalizar=totalItems>=5;summary.innerHTML=`<div class="summary"><div class="total"><span>Total de itens</span><span>${totalItems}</span></div><div class="estimatedTotalBox"><div><div class="label">💰 Total dos produtos</div><div class="sub">Prévia do valor antes da confirmação</div></div><div class="value" id="cartProductsTotal">${money(total)}</div></div><div class="notice">O valor dos produtos é uma prévia baseada nas faixas do catálogo. O frete será calculado conforme o endereço informado.</div><div class="minOrder ${podeFinalizar?'ok':''}">${podeFinalizar?'✅ Quantidade mínima atingida. Você já pode finalizar o pedido.':`⚠️ Pedido mínimo pelo catálogo: 5 itens. Adicione mais ${faltam} ${faltam===1?'item':'itens'} para finalizar.`}</div><div class="customer"><input id="customerName" placeholder="Seu nome *"><input id="customerWhats" placeholder="WhatsApp *" inputmode="tel"><div class="addressGrid"><div class="full addressSuggest"><input id="customerRua" placeholder="Digite o nome da rua e escolha o endereço" autocomplete="street-address"><div id="customerRuaSugestoes" class="addressSuggestions" style="display:none"></div></div><div><input id="customerNumero" placeholder="Número *" inputmode="numeric"></div><div><input id="customerComplemento" placeholder="Complemento"></div><div><input id="customerBairro" placeholder="Bairro *"></div><div><input id="customerCidade" value="Rio de Janeiro" placeholder="Cidade *"></div><div><input id="customerUF" value="RJ" maxlength="2" placeholder="UF *"></div><div><input id="customerCEP" placeholder="CEP" inputmode="numeric" autocomplete="postal-code"></div></div><select id="customerEntrega"><option value="">Como deseja receber?</option><option value="retirada">📍 Retirar no local</option><option value="entrega">🚚 Quero entrega</option></select><div id="customerFreight" class="freightBox">Selecione a forma de recebimento.</div><div class="freightActions"><button class="freightBtn" type="button" onclick="calcularFreteCatalogo()">📍 Calcular frete</button></div><div id="customerCheckoutTotal" class="checkoutTotal"><span>Total estimado</span><span>${money(total)}</span></div><textarea id="customerNote" rows="2" placeholder="Observação (opcional)"></textarea></div><button class="checkout" ${podeFinalizar?'':'disabled'} onclick="finalizeWhatsApp()">📲 Finalizar pedido pelo WhatsApp</button><button class="clear" onclick="clearCart()">Limpar carrinho</button></div>`;bindCatalogAddressEvents();updateCatalogFreightUI();}

let catalogFreteKm=1.00;
let catalogFreight={modo:'sem',kmReal:0,kmCobrado:0,valorKm:1,valor:0,origem:'',destino:'',ok:false};

function enderecoCatalogo(){return [document.getElementById('customerRua')?.value,document.getElementById('customerNumero')?.value,document.getElementById('customerComplemento')?.value,document.getElementById('customerBairro')?.value,document.getElementById('customerCidade')?.value,document.getElementById('customerUF')?.value,document.getElementById('customerCEP')?.value].filter(Boolean).join(', ');}

let catalogRuaTimer=null;
let catalogRuaResultados=[];

async function buscarRuaCatalogo(){
  const input=document.getElementById('customerRua');
  const box=document.getElementById('customerRuaSugestoes');
  if(!input||!box)return;
  const q=input.value.trim();
  if(q.length<3){box.style.display='none';box.innerHTML='';catalogRuaResultados=[];return;}

  box.style.display='block';
  box.innerHTML='<div style="padding:11px;color:#68736b">🔎 Procurando endereço...</div>';

  const consultas=[
    q+', Rio de Janeiro, RJ, Brasil',
    q+', Rio de Janeiro, RJ',
    q+', Brasil'
  ];
  let resultados=[];

  for(const consulta of consultas){
    try{
      const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=br&addressdetails=1&q='+encodeURIComponent(consulta);
      const r=await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
      if(r.ok){
        const data=await r.json();
        if(Array.isArray(data)&&data.length){resultados=data;break;}
      }
    }catch(e){console.warn('Nominatim catálogo:',e);}
  }

  if(!resultados.length){
    try{
      const r=await fetch('https://photon.komoot.io/api/?limit=6&lang=pt&q='+encodeURIComponent(q+', Rio de Janeiro, RJ, Brasil'));
      if(r.ok){
        const data=await r.json();
        resultados=(data.features||[]).map(f=>({
          display:[f.properties?.name,f.properties?.street,f.properties?.district,f.properties?.city,f.properties?.state,f.properties?.postcode].filter(Boolean).join(', '),
          address:{
            road:f.properties?.street||f.properties?.name||'',
            suburb:f.properties?.district||'',
            city:f.properties?.city||f.properties?.town||f.properties?.municipality||'Rio de Janeiro',
            state_code:f.properties?.state||'RJ',
            postcode:f.properties?.postcode||''
          }
        }));
      }
    }catch(e){console.warn('Photon catálogo:',e);}
  }

  catalogRuaResultados=resultados.map(x=>({
    display:x.display_name||x.display||'',
    road:x.address?.road||x.address?.pedestrian||x.address?.residential||x.address?.street||'',
    bairro:x.address?.suburb||x.address?.neighbourhood||x.address?.quarter||x.address?.district||'',
    cidade:x.address?.city||x.address?.town||x.address?.municipality||'Rio de Janeiro',
    uf:(x.address?.state_code||x.address?.state||'RJ').replace('BR-',''),
    cep:x.address?.postcode||''
  }));

  if(!catalogRuaResultados.length){
    box.innerHTML='<div style="padding:11px;color:#68736b">Nenhuma rua encontrada. Continue digitando ou preencha manualmente.</div>';
    box.style.display='block';
    return;
  }

  box.innerHTML=catalogRuaResultados.map((x,i)=>`<button type="button" data-rua-index="${i}">${esc(x.display||x.road)}</button>`).join('');
  box.style.display='block';
}

function selecionarRuaCatalogo(x){
  document.getElementById('customerRua').value=x.road||x.display||'';
  document.getElementById('customerBairro').value=x.bairro||'';
  document.getElementById('customerCidade').value=x.cidade||'Rio de Janeiro';
  document.getElementById('customerUF').value=(x.uf||'RJ').replace('BR-','');
  if(x.cep)document.getElementById('customerCEP').value=x.cep;
  const box=document.getElementById('customerRuaSugestoes');
  if(box){box.style.display='none';box.innerHTML='';}
  resetFreteCatalogo();
}

async function preencherCepCatalogo(){
  const el=document.getElementById('customerCEP');
  if(!el)return;
  const cep=el.value.replace(/\D/g,'');
  if(cep.length!==8)return;
  try{
    const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');
    const d=await r.json();
    if(!d.erro){
      document.getElementById('customerRua').value=d.logradouro||'';
      document.getElementById('customerBairro').value=d.bairro||'';
      document.getElementById('customerCidade').value=d.localidade||'Rio de Janeiro';
      document.getElementById('customerUF').value=d.uf||'RJ';
      resetFreteCatalogo();
    }
  }catch(e){console.warn('ViaCEP catálogo:',e);}
}

function bindCatalogAddressEvents(){
  const rua=document.getElementById('customerRua');
  const cep=document.getElementById('customerCEP');
  const entrega=document.getElementById('customerEntrega');
  const box=document.getElementById('customerRuaSugestoes');

  if(rua&&!rua.dataset.bound){
    rua.dataset.bound='1';
    rua.addEventListener('input',()=>{
      clearTimeout(catalogRuaTimer);
      catalogRuaTimer=setTimeout(buscarRuaCatalogo,450);
      resetFreteCatalogo();
    });
  }

  if(box&&!box.dataset.bound){
    box.dataset.bound='1';
    box.addEventListener('click',e=>{
      const btn=e.target.closest('[data-rua-index]');
      if(!btn)return;
      const item=catalogRuaResultados[Number(btn.dataset.ruaIndex)];
      if(item)selecionarRuaCatalogo(item);
    });
  }

  if(cep&&!cep.dataset.bound){
    cep.dataset.bound='1';
    cep.addEventListener('blur',preencherCepCatalogo);
  }

  document.querySelectorAll('#cartSummary .addressGrid input').forEach(el=>{
    if(!el.dataset.freightBound){
      el.dataset.freightBound='1';
      el.addEventListener('input',resetFreteCatalogo);
    }
  });

  if(entrega&&!entrega.dataset.bound){
    entrega.dataset.bound='1';
    entrega.addEventListener('change',()=>{
      catalogFreight.modo=entrega.value;
      resetFreteCatalogo();
      updateCatalogFreightUI();
    });
  }

  if(!document.body.dataset.catalogAddressBound){
    document.body.dataset.catalogAddressBound='1';
    document.addEventListener('click',e=>{
      if(!e.target.closest('.addressSuggest')){
        const b=document.getElementById('customerRuaSugestoes');
        if(b)b.style.display='none';
      }
    });
  }
}

function resetFreteCatalogo(){catalogFreight={modo:document.getElementById('customerEntrega')?.value||'sem',kmReal:0,kmCobrado:0,valorKm:1,valor:0,origem:'',destino:'',ok:false};updateCatalogFreightUI();}

function arredondarKmCatalogo(km){return Math.floor(km+0.5);}

async function geocodificarCatalogo(endereco){const raw=String(endereco||'').trim();if(!raw)throw new Error('Informe o endereço de entrega.');const cep=raw.replace(/\D/g,'');const consultas=[];if(cep.length===8){try{const vr=await fetch('https://viacep.com.br/ws/'+cep+'/json/');const vd=await vr.json();if(!vd.erro){const q=[vd.logradouro,vd.bairro,vd.localidade,vd.uf,vd.cep].filter(Boolean).join(', ');consultas.push(q);}}catch(e){}}consultas.push(raw);if(!/rio de janeiro|rj|brasil/i.test(raw))consultas.push(raw+', Rio de Janeiro - RJ, Brasil');if(!/brasil/i.test(raw))consultas.push(raw+', Brasil');let ultimoErro=null;for(const q of consultas){try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&addressdetails=1&q='+encodeURIComponent(q);const r=await fetch(url,{headers:{'Accept-Language':'pt-BR'}});if(r.ok){const data=await r.json();if(data.length)return {lat:Number(data[0].lat),lon:Number(data[0].lon),display:data[0].display_name};}}catch(e){ultimoErro=e;}try{const r=await fetch('https://photon.komoot.io/api/?limit=1&lang=pt&q='+encodeURIComponent(q));if(r.ok){const data=await r.json();const f=data.features?.[0];if(f?.geometry?.coordinates?.length)return {lat:Number(f.geometry.coordinates[1]),lon:Number(f.geometry.coordinates[0]),display:f.properties?.name?Object.values(f.properties).filter(Boolean).join(', '):q};}}catch(e){ultimoErro=e;}}throw new Error('Endereço não encontrado. Tente informar rua, número, bairro, cidade e UF ou o CEP completo.');}

async function calcularFreteCatalogo(){const btn=document.querySelector('.freightBtn'),out=document.getElementById('customerFreight'),entrega=document.getElementById('customerEntrega')?.value||'',endereco=enderecoCatalogo();if(entrega!=='entrega'){out.className='freightBox';out.textContent=entrega==='retirada'?'Retirada no local: sem frete.':'Selecione “Quero entrega” para calcular o frete.';catalogFreight.modo=entrega||'sem';updateCatalogFreightUI();return;}if(!document.getElementById('customerRua')?.value.trim()||!document.getElementById('customerNumero')?.value.trim()||!document.getElementById('customerBairro')?.value.trim()||!document.getElementById('customerCidade')?.value.trim()||!document.getElementById('customerUF')?.value.trim()){out.className='freightBox error';out.textContent='Preencha rua, número, bairro, cidade e UF antes de calcular o frete.';return;}btn.disabled=true;btn.textContent='⏳ Calculando...';out.className='freightBox';out.textContent='Calculando a rota pelas ruas...';try{const [a,b]=await Promise.all([geocodificarCatalogo('Benfica, Rio de Janeiro - RJ, Brasil'),geocodificarCatalogo(endereco)]);const rr=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false&alternatives=false`);if(!rr.ok)throw new Error('Não foi possível calcular a rota.');const rd=await rr.json();if(rd.code!=='Ok'||!rd.routes?.length)throw new Error('Rota não encontrada para esse endereço.');const kmReal=rd.routes[0].distance/1000,kmCobrado=arredondarKmCatalogo(kmReal),valorKm=catalogFreteKm,valor=kmCobrado*valorKm;catalogFreight={modo:'entrega',kmReal,kmCobrado,valorKm,valor,origem:a.display,destino:b.display,ok:true};out.innerHTML=`🚚 Frete: <b>${money(valor)}</b>`;updateCatalogFreightUI();}catch(e){catalogFreight.ok=false;out.className='freightBox error';out.textContent=e.message||'Erro ao calcular o frete.';updateCatalogFreightUI();}finally{btn.disabled=false;btn.textContent='📍 Calcular frete';}}

function updateCatalogFreightUI(){const out=document.getElementById('customerFreight'),totalEl=document.getElementById('customerCheckoutTotal');if(!out||!totalEl)return;const produtos=cart.reduce((s,x)=>s+Number(x.unitPrice||0)*Number(x.qty||0),0);const frete=catalogFreight.ok?catalogFreight.valor:0;const total=produtos+frete;totalEl.innerHTML=`<span>${catalogFreight.ok?'Produtos + frete':'Total estimado'}</span><span>${money(total)}</span>`;if(!catalogFreight.ok){const modo=document.getElementById('customerEntrega')?.value;if(modo==='retirada')out.textContent='Retirada no local: sem frete.';else if(modo!=='entrega')out.textContent='Selecione a forma de recebimento.';}}

function clearCart(){if(!confirm('Limpar todo o carrinho?'))return;cart=[];saveCart();renderCart()}
function finalizeWhatsApp(){
  const totalItems=cart.reduce((s,x)=>s+Number(x.qty||0),0);
  if(totalItems<5){alert(`O pedido mínimo pelo catálogo é de 5 itens. Você adicionou ${totalItems}.`);return}
  if(!cart.length){alert('Seu carrinho está vazio.');return}

  const name=(document.getElementById('customerName')?.value||'').trim();
  const whats=(document.getElementById('customerWhats')?.value||'').trim();
  const note=(document.getElementById('customerNote')?.value||'').trim();
  const entrega=(document.getElementById('customerEntrega')?.value||'').trim();

  if(!name||!whats){alert('Informe seu nome e WhatsApp.');return}
  if(!entrega){alert('Escolha se deseja retirada no local ou entrega.');return}

  if(entrega==='entrega'){
    const rua=(document.getElementById('customerRua')?.value||'').trim();
    const numero=(document.getElementById('customerNumero')?.value||'').trim();
    const bairro=(document.getElementById('customerBairro')?.value||'').trim();
    const cidade=(document.getElementById('customerCidade')?.value||'').trim();
    const uf=(document.getElementById('customerUF')?.value||'').trim();
    if(!rua||!numero||!bairro||!cidade||!uf){alert('Preencha o endereço completo antes de finalizar.');return}
    if(!catalogFreight.ok){alert('Clique em “Calcular frete” antes de finalizar o pedido.');return}
  }

  const totalProdutos=cart.reduce((s,x)=>s+Number(x.unitPrice||0)*Number(x.qty||0),0);
  const frete=catalogFreight.ok?catalogFreight.valor:0;
  const total=totalProdutos+frete;

  const linhas=[];
  linhas.push('*NOVO PEDIDO — GIBIPRINTS*');
  linhas.push('');
  linhas.push(`*Cliente:* ${name}`);
  linhas.push(`*WhatsApp:* ${whats}`);
  if(entrega==='entrega'){
    linhas.push(`*Endereço:* ${enderecoCatalogo()}`);
    linhas.push('*Recebimento:* Entrega');
    linhas.push(`*Frete:* ${money(frete)}`);
  }else{
    linhas.push('*Recebimento:* Retirada no local');
  }
  linhas.push('');
  linhas.push('*ITENS DO PEDIDO*');
  linhas.push('');

  cart.forEach((x,i)=>{
    linhas.push(`*${i+1}. ${x.product}*`);
    linhas.push(`Cor: ${x.color||'Não informada'}`);
    linhas.push(`Tamanho: ${x.size||'Não informado'}`);
    linhas.push(`Quantidade: ${x.qty}`);
    linhas.push(`Valor: ${money(Number(x.unitPrice||0)*Number(x.qty||0))}`);
    linhas.push('');
  });

  linhas.push(`*Total de itens: ${totalItems}*`);
  linhas.push(`*Total dos produtos: ${money(totalProdutos)}*`);
  if(entrega==='entrega') linhas.push(`*Frete: ${money(frete)}*`);
  linhas.push(`*TOTAL DO PEDIDO: ${money(total)}*`);
  if(note){linhas.push('');linhas.push(`*Observação:* ${note}`)}
  linhas.push('');
  linhas.push('Enviado pelo catálogo online GIBIPRINTS.');

  const msg=linhas.join('\n');
  const url=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.location.href=url;
}
async function carregarConfiguracaoFreteCatalogo(){
  try{
    const {data,error}=await supabaseClient.from('catalogo_config').select('frete_km').eq('id','default').maybeSingle();
    if(error)throw error;
    const v=Number(data?.frete_km);
    if(Number.isFinite(v)&&v>=0.10&&v<=10)catalogFreteKm=Math.round(v*100)/100;
  }catch(e){console.warn('Configuração de frete do catálogo:',e);catalogFreteKm=1.00;}
}

async function load(){const status=document.getElementById('status');try{
if(!supabaseClient)throw new Error('Biblioteca do catálogo não carregou. Verifique a internet e recarregue a página.');
await carregarConfiguracaoFreteCatalogo();
const {data,error}=await supabaseClient.from('produtos').select('id,nome,categoria,descricao,precos,tamanhos,cores,ativo').eq('ativo',true).order('nome');
if(error)throw error;
products=Array.isArray(data)?data:[];
if(products.length){
  const ids=products.map(p=>p.id);
  const map=new Map(ids.map(id=>[id,[]]));
  try{
    const {data:fotos,error:fe}=await supabaseClient.from('catalogo_fotos').select('produto_id,public_url,storage_path,ordem').in('produto_id',ids).eq('ativo',true).order('ordem');
    if(!fe){
      for(const f of (fotos||[])){
        const url=f.public_url||supabaseClient.storage.from('gibiprints-fotos').getPublicUrl(f.storage_path).data.publicUrl;
        if(url)map.get(f.produto_id)?.push(url);
      }
    }else console.warn('Fotos do catálogo não puderam ser lidas:',fe);
  }catch(photoError){console.warn('Fotos do catálogo indisponíveis:',photoError);}
  products=products.map(p=>({...p,fotos:map.get(p.id)||[]}));
}
document.getElementById('grid').innerHTML=products.map(productCard).join('');
products.forEach(bindSwipeGallery);
status.textContent=products.length?`${products.length} produto(s) no catálogo`:'Nenhum produto ativo no catálogo.';
repriceCart();saveCart();
}catch(e){
console.error(e);
status.innerHTML='<div class="error"><strong>Não foi possível carregar o catálogo.</strong><br><small>'+esc(e?.message||'Erro desconhecido')+'</small><br><button onclick="location.reload()" style="margin-top:10px;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:#fff;font-weight:900">Recarregar</button></div>'
}}
renderCart();load();
</script>

<script>
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && typeof products!=='undefined'){
    products.forEach(p=>{
      const wrap=galleryWrap?.(p.id);
      if(!wrap||!p.fotos||p.fotos.length<2)return;
      const track=wrap.querySelector('.swipe-track');
      if(!track)return;
      const logical=((galleryState[p.id]||0)%p.fotos.length+p.fotos.length)%p.fotos.length;
      galleryState[p.id]=logical;
      track.style.transition='none';
      track.style.transform=`translate3d(${-(logical+1)*100}%,0,0)`;
      wrap.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===logical));
    });
  }
});
</script>
